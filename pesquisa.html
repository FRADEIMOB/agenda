<title>Avalie o atendimento · Frade Imóveis</title>

<style>
:root{--marinho:#022C45;--laranja:#E65100;--txt:#0f172a;--mut:#64748b;--borda:#e2e8f0;--fundo:#f1f5f9}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:var(--marinho);color:#fff;padding:22px 16px 60px;text-align:center}
header img{width:58px;height:58px;border-radius:16px;display:block;margin:0 auto 10px}
header b{display:block;font-size:18px;letter-spacing:.02em}
header span{font-size:13px;opacity:.8}
main{width:min(520px,calc(100% - 32px));background:#fff;border-radius:20px;margin-top:-40px;padding:24px 20px;box-shadow:0 12px 34px #0f172a1a}
h1{font-size:20px;margin:0 0 6px;line-height:1.3}
p{margin:0 0 18px;color:var(--mut);font-size:15px;line-height:1.45}
.notas{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin-bottom:6px}
.notas button{aspect-ratio:1;border:1px solid var(--borda);background:#fff;border-radius:10px;font-size:15px;font-weight:700;color:var(--txt);cursor:pointer;padding:0}
.notas button.on{background:var(--laranja);border-color:var(--laranja);color:#fff}
.legenda{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:18px}
textarea{width:100%;min-height:90px;border:1px solid var(--borda);border-radius:12px;padding:12px;font:inherit;font-size:15px;resize:vertical}
label.ok{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mut);margin:12px 0 18px}
label.ok input{margin-top:3px;width:18px;height:18px}
.btn{width:100%;border:0;background:var(--laranja);color:#fff;font-size:16px;font-weight:700;padding:15px;border-radius:14px;cursor:pointer}
.btn:disabled{opacity:.5}
.fim{text-align:center;padding:10px 0}
.fim div{font-size:52px}
.erro{color:#b91c1c}
footer{font-size:12px;color:var(--mut);padding:18px}
@media(max-width:380px){.notas{grid-template-columns:repeat(6,1fr)}}
</style>
</head>

<footer>Sua resposta vai só para a equipe da Frade Imóveis.</footer>
<script>
const PROJETO = 'agenda-37236', CHAVE_API = 'AIzaSyA6o_z10mWoncQVnCjTRkTAp5PPQVwnC5g', CARTEIRO = 'https://carteiro-frade.allanvgron.workers.dev/pesquisa';
const t = new URLSearchParams(location.search).get('t') || '';
const URL_DOC = `https://firestore.googleapis.com/v1/projects/${PROJETO}/databases/(default)/documents/pesquisas/${encodeURIComponent(t)}`;
const caixa = document.getElementById('caixa');
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const primeiro = n => String(n || '').trim().split(' ')[0].toLowerCase().replace(/^./, c => c.toUpperCase());
let nota = null;
function obrigado(){ caixa.innerHTML = '<div class="fim"><div>🙏</div><h1>Muito obrigado!</h1><p>A sua opinião ajuda a gente a atender cada vez melhor.</p></div>'; }
async function iniciar(){
  if (!/^[A-Za-z0-9]{16,40}$/.test(t)) { caixa.innerHTML = '<p class="erro">Link inválido. Peça um novo link ao seu corretor.</p>'; return; }
  try {
    // tenta com a chave do app e, se der erro, sem a chave (a leitura da pesquisa é pública)
    let r = await fetch(URL_DOC + '?key=' + CHAVE_API).catch(() => null);
    if (!r || !r.ok) { const r2 = await fetch(URL_DOC).catch(() => null); if (r2 && (r2.ok || !r)) r = r2; }
    if (!r || !r.ok) { let det = ''; try { const j = await r.json(); det = (j.error && (j.error.status || j.error.message)) || ''; } catch(_) {}
      const e = new Error(); e.cod = r ? r.status + (det ? ' · ' + det : '') : 'sem internet'; throw e; }
    const f = (await r.json()).fields || {};
    if (f.respondida && f.respondida.booleanValue) { obrigado(); return; }
    const cor = primeiro(f.corretorNome && f.corretorNome.stringValue), cli = primeiro(f.cliente && f.cliente.stringValue);
    caixa.innerHTML = `<h1>${cli ? 'Oi, ' + esc(cli) + '! ' : ''}Como foi o seu atendimento${cor ? ' com ' + esc(cor) : ''}?</h1>
      <p>De 0 a 10, quanto você recomendaria o nosso atendimento para um amigo?</p>
      <div class="notas">${[...Array(11)].map((_, i) => `<button type="button" onclick="escolher(${i})" id="n${i}">${i}</button>`).join('')}</div>
      <div class="legenda"><span>0 = nada</span><span>10 = com certeza</span></div>
      <textarea id="com" maxlength="600" placeholder="Quer contar como foi? (opcional)"></textarea>
      <label class="ok"><input type="checkbox" id="dep"> Autorizo a Frade Imóveis a usar meu comentário como depoimento, só com o meu primeiro nome.</label>
      <button class="btn" id="env" disabled onclick="enviar()">Enviar avaliação</button>`;
  } catch(e) { caixa.innerHTML = '<p class="erro">Não encontramos esta pesquisa. Peça um novo link ao seu corretor.</p>' + (e.cod ? `<p style="font-size:12px;color:#94a3b8;margin-top:10px">código: ${esc(String(e.cod))}</p>` : ''); }
}
function escolher(i){ nota = i; document.querySelectorAll('.notas button').forEach((b, j) => b.classList.toggle('on', j === i)); document.getElementById('env').disabled = false; }
async function enviar(){
  if (nota === null) return;
  const b = document.getElementById('env'); b.disabled = true; b.textContent = 'Enviando…';
  const campos = { nota:{ integerValue:String(nota) }, comentario:{ stringValue:document.getElementById('com').value.trim().slice(0, 600) },
    depoimento:{ booleanValue:document.getElementById('dep').checked }, respondida:{ booleanValue:true }, respondidaEm:{ integerValue:String(Date.now()) } };
  const mascara = Object.keys(campos).map(k => 'updateMask.fieldPaths=' + k).join('&');
  try {
    const r = await fetch(`${URL_DOC}?key=${CHAVE_API}&${mascara}&currentDocument.exists=true`, { method:'PATCH', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ fields:campos }) });
    if (!r.ok) throw new Error(await r.text());
    fetch(CARTEIRO, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ t }) }).catch(() => {});
    obrigado();
  } catch(e) { b.disabled = false; b.textContent = 'Enviar avaliação'; alert('Não foi possível enviar agora. Confira a internet e tente de novo.'); }
}
iniciar();
</script>
